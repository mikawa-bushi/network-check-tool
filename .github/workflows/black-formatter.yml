name: Black Code Formatter

on:
  push:
    branches:
      - '**'  # every branch, including names with '/'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  black-check:
    runs-on: ubuntu-latest
    name: Check Black formatting

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      id: setup-python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Install Poetry
      uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263  # v1.4.2
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Cache Poetry dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-

    - name: Install dependencies
      run: poetry install --only=dev

    - name: Run Black check
      run: poetry run black --check --diff netdiag/ tests/

    - name: Run Ruff import-order check
      # Enforce in CI the same import ordering the pre-commit gate applies, so a
      # contributor who skips the local hooks is still caught. The version comes
      # from the dev group and the scope (isort "I") from pyproject.
      run: poetry run ruff check --output-format=github .
