name: Publish to PyPI

# A v* tag releases netdiag: the full test suite runs first, then the tag must
# name the package version. Only then do the sdist and wheel go to PyPI and the
# Windows exe zip to the tag's GitHub release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Check the tag matches the package version
      run: |
        version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['tool']['poetry']['version'])")
        test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME, package version $version"; exit 1; }

    - name: Build the sdist and wheel
      run: |
        python -m pip install --upgrade build
        python -m build

    - name: Upload dist
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  exe:
    needs: build
    uses: ./.github/workflows/windows-exe.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/network-check-tool/
    permissions:
      id-token: write  # trusted publishing: PyPI accepts this run's OIDC token instead of an API token

    steps:
    - name: Download dist
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Publish
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  release-exe:
    needs: exe
    runs-on: ubuntu-latest
    permissions:
      contents: write  # uploads the zip to the tag's release
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ZIP: ${{ needs.exe.outputs.zip }}

    steps:
    - name: Download the exe zip
      uses: actions/download-artifact@v4
      with:
        name: ${{ needs.exe.outputs.zip }}

    - name: Attach to the release
      run: |
        gh release upload "$GITHUB_REF_NAME" "$ZIP.zip" --clobber \
          || gh release create "$GITHUB_REF_NAME" "$ZIP.zip" --verify-tag --generate-notes
