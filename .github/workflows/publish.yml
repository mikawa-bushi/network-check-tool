name: Publish to PyPI

# A v* tag releases netdiag. The test workflow runs the full suite and builds
# the sdist and wheel. Then the tag must name the version of that wheel, and
# exactly those files go to PyPI.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  publish:
    needs: tests
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/network-check-tool/
    permissions:
      id-token: write  # trusted publishing: PyPI accepts this run's OIDC token instead of an API token

    steps:
    - name: Download dist
      uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/

    - name: Check the tag matches the package version
      run: |
        wheel="dist/network_check_tool-${GITHUB_REF_NAME#v}-py3-none-any.whl"
        test -f "$wheel" || { echo "tag $GITHUB_REF_NAME does not match the built package:"; ls dist; exit 1; }

    - name: Publish
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
