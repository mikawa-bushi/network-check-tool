name: Tests

on:
  push:
    branches:
      - '*'  # Run on all branches
  pull_request:
    branches:
      - '*'  # Run on all branches for PRs

jobs:
  pytest:
    runs-on: ubuntu-latest
    name: Run pytest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Cache Poetry dependencies
      uses: actions/cache@v3
      with:
        path: .venv
        # Distinct from the Black workflow's key: that job installs --only=dev,
        # so sharing a key could restore a .venv missing the main-group deps.
        key: venv-tests-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          venv-tests-${{ runner.os }}-

    - name: Install dependencies
      # Main + dev groups: runtime deps (Flask, netdiag, scheduler, ...) plus pytest.
      run: poetry install

    - name: Run pytest
      run: poetry run pytest
