name: Tests

# Once per commit: on pull requests, and on main after a merge. publish.yml runs
# this workflow too and publishes the dist that the package job builds here.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint (black, ruff)

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Install black and ruff
      # The same versions as the black and ruff-check hooks in .pre-commit-config.yaml.
      run: python -m pip install black==26.10.1 ruff==0.15.17

    - name: Check formatting
      run: black --check --diff netdiag tests

    - name: Check import order
      # The rule set (isort "I") comes from pyproject.
      run: ruff check --output-format=github .

  pytest:
    runs-on: ubuntu-latest
    name: Run pytest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      id: setup-python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install Poetry
      uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263  # v1.4.2
      with:
        version: 2.5.1  # the version that wrote poetry.lock
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Cache Poetry dependencies
      uses: actions/cache@v6
      with:
        path: .venv
        key: venv-tests-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          venv-tests-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-

    - name: Install dependencies
      # Main + dev groups from poetry.lock. pre-commit is a dev dependency, so the
      # push-gate tests run in this job and are skipped elsewhere.
      run: poetry install

    - name: Run pytest
      run: poetry run pytest

  # The same suite on every OS netdiag supports, followed by a live smoke run on
  # the real runner network. The `collect` zip is kept as an artifact so the raw
  # tool output of each OS can be inspected or turned into test fixtures.
  os-matrix:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.14']
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}

    - name: Install
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e . pytest pyyaml

    - name: Run pytest
      run: python -m pytest -q

    - name: Smoke — check this PC
      run: |
        bash scripts/expect_verdict.sh python -m netdiag --lang en check --format json -o check.json
        python -c "import json; d=json.load(open('check.json', encoding='utf-8')); print(d['status'], [r['code'] for r in d['host']['results']]); assert d['host']['results']"

    - name: Smoke — ping, device check and a short soak against loopback
      run: |
        python -m netdiag --lang ja ping 127.0.0.1 -c 5
        bash scripts/expect_verdict.sh python -m netdiag --lang en ping 127.0.0.1 -c 5 --json > ping.json
        python -c "import json; d=json.load(open('ping.json')); print(d['method'], d['received'], '/', d['sent']); assert d['received'] == d['sent'] == 5"
        bash scripts/expect_verdict.sh python -m netdiag --lang ja check --no-host 127.0.0.1 LOOP=127.0.0.1:1 -o devices.json
        python -c "import json; d=json.load(open('devices.json', encoding='utf-8')); s={x['device']['name']: x['status'] for x in d['devices']}; print(s); assert s == {'127.0.0.1': 'ok', 'LOOP': 'fail'}"
        bash scripts/expect_verdict.sh python -m netdiag soak 127.0.0.1 --duration 5 --bucket 2 --format json -o soak.json
        python -c "import json; [t]=json.load(open('soak.json', encoding='utf-8'))['devices']; print(t['sent'], t['lost']); assert t['sent'] > 0 and t['lost'] == 0"

    - name: Smoke — collect raw tool output
      run: python -m netdiag --lang ja collect -o collect-${{ matrix.os }}.zip

    - name: Upload smoke artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: netdiag-smoke-${{ matrix.os }}
        path: |
          check.json
          ping.json
          devices.json
          soak.json
          collect-${{ matrix.os }}.zip
        if-no-files-found: warn

  package:
    runs-on: ubuntu-latest
    name: Build the package

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Build the sdist and wheel
      run: |
        python -m pip install build twine
        python -m build
        python -m twine check --strict dist/*

    - name: Upload dist
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/
        if-no-files-found: error

  # Installs the wheel with no source tree, the way pip users get it, and
  # downloads it the same way publish.yml does before it uploads to PyPI.
  install-wheel:
    needs: package
    runs-on: ubuntu-latest
    name: Install the wheel on Python 3.11

    steps:
    - name: Download dist
      uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install the wheel and read its version
      run: |
        python -m pip install dist/*.whl
        version=$(basename dist/*.whl | cut -d- -f2)
        netdiag --version
        netdiag --version | grep -qx "netdiag, version $version"
