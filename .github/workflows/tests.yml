name: Tests

on:
  push:
    branches:
      - '**'  # every branch, including names with '/' (feature/..., refactor/...)
  pull_request:
    branches:
      - '**'

jobs:
  pytest:
    runs-on: ubuntu-latest
    name: Run pytest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Cache Poetry dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        # Distinct from the Black workflow's key: that job installs --only=dev,
        # so sharing a key could restore a .venv missing the main-group deps.
        key: venv-tests-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          venv-tests-${{ runner.os }}-

    - name: Install dependencies
      # Main + dev groups: runtime deps (Flask, netdiag, scheduler, ...) plus pytest.
      run: poetry install

    - name: Run pytest
      run: poetry run pytest

  # The same suite on every OS netdiag supports, followed by a live smoke run on
  # the real runner network. Windows exercises the IcmpSendEcho/SendARP path and
  # PowerShell parsing for real; the `collect` zip is kept as an artifact so the
  # raw tool output of each OS can be inspected or turned into test fixtures.
  os-matrix:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12']
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}

    - name: Install
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e . pytest pyyaml

    - name: Run pytest
      run: python -m pytest -q

    - name: Smoke — check this PC (exit 0/1/2 = verdict; anything else = crash)
      run: |
        set +e
        python -m netdiag --lang en check --format json -o check.json
        rc=$?
        echo "exit code: $rc"
        test "$rc" -le 2 || exit 1
        python -c "import json; d=json.load(open('check.json', encoding='utf-8')); print(d['status'], [r['code'] for r in d['host']['results']])"

    - name: Smoke — ping, device check and a short soak against loopback
      run: |
        set +e
        python -m netdiag --lang ja ping 127.0.0.1 -c 5
        python -m netdiag --lang en ping 127.0.0.1 -c 5 --json > ping.json
        python -c "import json; d=json.load(open('ping.json')); print(d['method'], d['received'], '/', d['sent']); assert d['received'] == d['sent'] == 5"
        rc=$?; test "$rc" -eq 0 || exit 1
        python -m netdiag --lang ja check --no-host 127.0.0.1 LOOP=127.0.0.1:1
        rc=$?; echo "exit code: $rc"; test "$rc" -le 2 || exit 1
        python -m netdiag soak 127.0.0.1 --duration 5 --bucket 2 --format json -o soak.json
        rc=$?; echo "exit code: $rc"; test "$rc" -le 2 || exit 1

    - name: Smoke — collect raw tool output
      run: python -m netdiag --lang ja collect -o collect-${{ matrix.os }}.zip

    - name: Upload smoke artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: netdiag-smoke-${{ matrix.os }}
        path: |
          check.json
          ping.json
          soak.json
          collect-${{ matrix.os }}.zip
        if-no-files-found: warn
