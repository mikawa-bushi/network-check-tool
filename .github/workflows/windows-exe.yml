name: Windows exe

# Builds the single-file netdiag.exe (no Python needed on the target PC) and
# smoke-tests the exe itself. On a v* tag, publish.yml calls this after the
# tests pass and attaches the zip to the release.
on:
  push:
    branches:
      - '**'
    paths:
      - 'netdiag/**'
      - 'packaging/windows/**'
      - 'examples/devices.csv'
      - 'pyproject.toml'
      - 'scripts/expect_verdict.sh'
      - '.github/workflows/windows-exe.yml'
  workflow_dispatch:
  workflow_call:
    outputs:
      zip:
        description: Name of the uploaded exe zip artifact, without .zip
        value: ${{ jobs.build.outputs.zip }}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      zip: ${{ steps.pkg.outputs.name }}
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Install netdiag and PyInstaller
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[yaml]" "pyinstaller~=6.15"

    - name: Build netdiag.exe
      run: |
        pyinstaller --noconfirm --clean --onefile --console --name netdiag \
          --copy-metadata network-check-tool \
          --exclude-module tkinter \
          packaging/windows/netdiag_exe.py
        ls -l dist

    - name: Smoke — the exe itself
      env:
        NETDIAG_NO_OPEN: '1'
      run: |
        version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['tool']['poetry']['version'])")
        test "$(./dist/netdiag.exe --version)" = "netdiag, version $version"
        bash scripts/expect_verdict.sh ./dist/netdiag.exe --lang en check --format json -o check.json
        python -c "import json; d=json.load(open('check.json', encoding='utf-8')); print(d['status'], [r['code'] for r in d['host']['results']]); assert d['host']['results']"
        ./dist/netdiag.exe --lang en ping 127.0.0.1 -c 5 --json > ping.json
        python -c "import json; d=json.load(open('ping.json')); print(d['method'], d['received'], '/', d['sent']); assert d['received'] == d['sent'] == 5"
        # Drag-and-drop mode: a device list as the only argument, Enter to close.
        mkdir -p dropped
        python -c "open('dropped/line.csv', 'w', encoding='cp932', newline='').write('名前,IPアドレス\r\nLOOP,127.0.0.1\r\n')"
        echo | bash scripts/expect_verdict.sh ./dist/netdiag.exe "$(cygpath -w "$PWD/dropped/line.csv")"
        ls dropped
        python - "$version" <<'EOF'
        import glob, re, sys
        [path] = glob.glob("dropped/*.html")
        page = open(path, encoding="utf-8").read()
        row = re.search(r"<tr class='(\w+)'><td class='st'>[^<]*</td><td>LOOP<", page)
        assert row and row.group(1) == "ok", f"the dropped device LOOP is not OK in {path}"
        assert f"netdiag {sys.argv[1]}</div>" in page, f"{path} does not name netdiag {sys.argv[1]}"
        EOF

    - name: Package
      id: pkg
      run: |
        version=$(python -c "from importlib.metadata import version; print(version('network-check-tool'))")
        name="netdiag-windows-x64-${version}"
        mkdir -p "pkg/$name"
        cp dist/netdiag.exe "pkg/$name/"
        cp packaging/windows/README.txt "pkg/$name/README.txt"
        cp examples/devices.csv "pkg/$name/devices_sample.csv"
        cp LICENSE "pkg/$name/LICENSE.txt"
        # Everything the exe bundles besides netdiag: the click CLI, PyYAML for
        # YAML lists, PyInstaller's bootloader.
        python packaging/windows/third_party_notices.py \
          "pkg/$name/THIRD_PARTY_NOTICES.txt" click PyYAML pyinstaller
        grep -E '^(Python|OpenSSL|click|PyYAML|pyinstaller) [0-9]' "pkg/$name/THIRD_PARTY_NOTICES.txt"
        (cd pkg && python -m zipfile -c "$name.zip" "$name")
        echo "name=$name" >> "$GITHUB_OUTPUT"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.pkg.outputs.name }}
        path: pkg/${{ steps.pkg.outputs.name }}.zip
