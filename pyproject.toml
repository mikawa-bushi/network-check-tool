[tool.poetry]
name = "network-check-tool"
version = "0.2.3"
description = "Local-first network & OS trouble isolation (netdiag) plus a ping-monitoring dashboard (network-checker)."
authors = ["hardwork9047 <155122235+hardwork9047@users.noreply.github.com>"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/mikawa-bushi/network-check-tool"
repository = "https://github.com/mikawa-bushi/network-check-tool"
documentation = "https://github.com/mikawa-bushi/network-check-tool/blob/main/docs/netdiag.md"
keywords = ["network", "monitoring", "diagnostics", "troubleshooting", "ping", "netdiag", "cli", "sysadmin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: System :: Systems Administration",
]
packages = [
    { include = "network_check_tool" },
    { include = "netdiag" },
]

# Non-Python data files to ship. The packages above already include all .py
# modules; only the Flask dashboard template needs listing explicitly.
include = [
    "network_check_tool/templates/*",
]

[tool.poetry.dependencies]
python = "^3.10"
flask = "^3.1.0"
flask-sqlalchemy = "^3.1.1"
pandas = "^2.2.3"
flask-cors = "^4.0.0"
click = "^8.1.3"
apscheduler = "^3.10.4"
plotly = "^5.17.0"
toml = "^0.10.2"
# Optional: only needed for `netdiag scenario` with .yaml files (JSON works without it).
pyyaml = { version = "^6.0", optional = true }

[tool.poetry.extras]
# netdiag's core is stdlib + click only; this extra just adds YAML scenario support.
scenario = ["pyyaml"]

[tool.poetry.scripts]
network-checker = "network_check_tool.cli:cli"
netdiag = "netdiag.cli:main"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
black = "^24.0.0"

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
skip-string-normalization = false

[tool.pytest.ini_options]
# Only collect the project's own tests (keeps CI from scanning .venv etc.).
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
