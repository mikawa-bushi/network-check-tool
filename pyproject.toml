[tool.poetry]
name = "network-check-tool"
version = "0.5.0"
description = "netdiag: network checks for production engineers. Diagnose this PC and every PLC/HMI on the line."
authors = ["hardwork9047 <155122235+hardwork9047@users.noreply.github.com>"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/mikawa-bushi/network-check-tool"
repository = "https://github.com/mikawa-bushi/network-check-tool"
documentation = "https://github.com/mikawa-bushi/network-check-tool/blob/main/docs/netdiag.md"
keywords = ["network", "monitoring", "diagnostics", "troubleshooting", "ping", "netdiag", "plc", "factory", "ot", "industrial", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Natural Language :: Japanese",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: System :: Networking",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: System :: Systems Administration",
]
packages = [
    { include = "netdiag" },
]

[tool.poetry.dependencies]
python = "^3.11"
click = "^8.1.3"
# Optional: only needed for YAML device lists / scenarios (CSV/JSON/TOML work without it).
pyyaml = { version = "^6.0", optional = true }

[tool.poetry.extras]
# netdiag's core is stdlib + click only; these extras just add YAML support.
yaml = ["pyyaml"]
scenario = ["pyyaml"]

[tool.poetry.scripts]
netdiag = "netdiag.cli:main"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
black = "^26.10.1"
# The same version as the ruff-check pre-commit hook and CI.
ruff = "0.15.17"
# Transitive via pre-commit -> virtualenv; 4.2.1 fixes GHSA advisories.
filelock = ">=4.2.1"
pre-commit = "^4.6.0"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
skip-string-normalization = false

[tool.ruff.lint]
# CI enforces Black only; Ruff is wired into the pre-commit gate purely for import
# sorting. Scope it to the isort ("I") rules so `ruff-check --fix` never trips on the
# broader default set (F-codes such as F401/F821, E-codes) that this repo has no
# policy for. Widen this `select` only alongside a matching CI policy.
select = ["I"]

[tool.pytest.ini_options]
# Only collect the project's own tests (keeps CI from scanning .venv etc.).
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
