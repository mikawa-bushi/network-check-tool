<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ 'ネットワーク監視' if lang == 'ja' else 'Network Checker' }}</title>
    <script src="{{ url_for('dashboard.plotly_js') }}"></script>
    <style>
        /* Colors live in CSS variables so the whole UI follows the OS light/dark
           preference (prefers-color-scheme) without any JS. */
        :root {
            --bg: #f5f5f5;
            --card-bg: #ffffff;
            --text: #1a1a1a;
            --muted: #666666;
            --accent: #007bff;
            --accent-hover: #0056b3;
            --border: #dddddd;
            --shadow: rgba(0, 0, 0, 0.1);
            --error-bg: #f8d7da;
            --error-fg: #721c24;
            --neutral-fg: #666666;
            /* Status colors are reserved for state and always paired with an
               icon and a word, never color alone. */
            --ok: #0ca30c;
            --warn: #fab219;
            --down: #d03b3b;
            --unknown: #9a9a96;
            --down-wash: rgba(208, 59, 59, 0.08);
            --warn-wash: rgba(250, 178, 25, 0.10);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #15181c;
                --card-bg: #1f242b;
                --text: #e6e6e6;
                --muted: #9aa4af;
                --accent: #4c8dff;
                --accent-hover: #6ba1ff;
                --border: #3a4049;
                --shadow: rgba(0, 0, 0, 0.45);
                --error-bg: #4a2225;
                --error-fg: #f5c2c7;
                --neutral-fg: #9aa4af;
                --unknown: #7d838a;
                --down-wash: rgba(208, 59, 59, 0.16);
                --warn-wash: rgba(250, 178, 25, 0.12);
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Meiryo', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--bg);
            color: var(--text);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: var(--card-bg);
            padding: 16px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 4px var(--shadow);
            margin-bottom: 16px;
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px;
        }

        .header h1 { margin: 0; font-size: 1.5em; }
        .header p { margin: 4px 0 0; color: var(--muted); }
        .lang-switch a { color: var(--accent); text-decoration: none; margin-left: 8px; }
        .lang-switch a[aria-current="true"] { color: var(--text); font-weight: bold; }

        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .tabs button {
            background: none;
            color: var(--muted);
            border: none;
            border-bottom: 3px solid transparent;
            border-radius: 0;
            padding: 10px 16px;
            font-size: 15px;
        }

        .tabs button:hover { background: none; color: var(--text); }
        .tabs button[aria-selected="true"] {
            color: var(--text);
            border-bottom-color: var(--accent);
            font-weight: bold;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
            align-items: center;
        }

        select, button, input {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 14px;
            background: var(--card-bg);
            color: var(--text);
        }

        button {
            background-color: var(--accent);
            color: #ffffff;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        /* ---- line board ---- */
        .summary {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
        }

        .chip {
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 1px 3px var(--shadow);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 110px;
        }

        .chip .num { font-size: 1.6em; font-weight: bold; }
        .chip .word { color: var(--muted); }

        .icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 1.3em;
            height: 1.3em;
            border-radius: 50%;
            font-size: 0.85em;
            font-weight: bold;
            color: #ffffff;
            flex: none;
        }

        .icon.ok { background: var(--ok); }
        .icon.warn { background: var(--warn); color: #0b0b0b; }
        .icon.down { background: var(--down); }
        .icon.unknown { background: var(--unknown); }

        .group { margin-bottom: 20px; }
        .group h2 {
            font-size: 1.05em;
            margin: 0 0 8px;
            display: flex;
            gap: 10px;
            align-items: baseline;
        }
        .group h2 .sub { color: var(--muted); font-weight: normal; font-size: 0.9em; }

        .tiles {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 10px;
        }

        .tile {
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 1px 3px var(--shadow);
            border-left: 6px solid var(--unknown);
            padding: 10px 12px;
            cursor: pointer;
            text-align: left;
            color: var(--text);
            font: inherit;
            /* A <button> centers its content vertically; tiles read top-down. */
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            width: 100%;
        }

        .tile:hover { background: var(--card-bg); box-shadow: 0 2px 8px var(--shadow); }
        .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .tile.ok { border-left-color: var(--ok); }
        .tile.warn { border-left-color: var(--warn); background: linear-gradient(var(--warn-wash), var(--warn-wash)), var(--card-bg); }
        .tile.down { border-left-color: var(--down); background: linear-gradient(var(--down-wash), var(--down-wash)), var(--card-bg); }

        .tile .top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
        .tile .state { display: inline-flex; gap: 6px; align-items: center; font-weight: bold; font-size: 0.9em; }
        .tile .name { font-size: 1.15em; font-weight: bold; margin-top: 6px; overflow-wrap: anywhere; }
        .tile .addr { color: var(--muted); font-size: 0.85em; overflow-wrap: anywhere; }
        .tile .metrics { margin-top: 6px; font-size: 0.9em; font-variant-numeric: tabular-nums; }
        .tile .seen { color: var(--muted); font-size: 0.85em; }
        .tile .why { margin-top: 6px; font-size: 0.85em; border-top: 1px solid var(--border); padding-top: 6px; overflow-wrap: anywhere; white-space: pre-line; }

        .panel {
            background: var(--card-bg);
            padding: 16px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 4px var(--shadow);
            margin-bottom: 20px;
        }

        .panel h2 { margin-top: 0; font-size: 1.1em; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 4px var(--shadow);
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: var(--text);
            font-variant-numeric: tabular-nums;
        }

        .stat-label {
            color: var(--muted);
            margin-top: 5px;
        }

        .chart-container {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 4px var(--shadow);
            margin-bottom: 20px;
        }

        /* Neutral placeholder: loading + "no data yet" (an empty period is normal,
           not an error, so it must not look like the red error box). */
        .loading, .empty {
            text-align: center;
            padding: 50px;
            color: var(--neutral-fg);
        }

        .error {
            background-color: var(--error-bg);
            color: var(--error-fg);
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .table-scroll { overflow-x: auto; }

        .jobs-table {
            width: 100%;
            border-collapse: collapse;
        }

        .jobs-table th, .jobs-table td {
            text-align: left;
            padding: 8px 6px;
            border-bottom: 1px solid var(--border);
            font-size: 0.9em;
            vertical-align: top;
        }

        .jobs-table td.when { white-space: nowrap; font-variant-numeric: tabular-nums; }

        [hidden] { display: none !important; }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .stat-value { font-size: 1.6em; }
            .tiles { grid-template-columns: 1fr; }
            /* Alerts as stacked cards: the detail column is the useful part. */
            .alerts-table thead { display: none; }
            .alerts-table tr { display: block; border-bottom: 1px solid var(--border); padding: 6px 0; }
            .alerts-table td { display: block; border: none; padding: 2px 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1 data-i18n="title"></h1>
                <p data-i18n="lead"></p>
            </div>
            <nav class="lang-switch" aria-label="Language">
                <a href="?lang=ja" lang="ja" {% if lang == 'ja' %}aria-current="true"{% endif %}>日本語</a>
                <a href="?lang=en" lang="en" {% if lang == 'en' %}aria-current="true"{% endif %}>English</a>
            </nav>
        </div>

        <div class="tabs" role="tablist">
            <button type="button" role="tab" id="tabBoard" aria-controls="boardView" aria-selected="true" data-i18n="tab_board"></button>
            <button type="button" role="tab" id="tabChart" aria-controls="chartView" aria-selected="false" data-i18n="tab_chart"></button>
        </div>

        <!-- Line board: every device as a tile, grouped by line / area. -->
        <section id="boardView" role="tabpanel" aria-labelledby="tabBoard">
            <div class="controls">
                <label for="boardRange" data-i18n="window"></label>
                <select id="boardRange">
                    <option value="1" data-i18n="h1"></option>
                    <option value="6" data-i18n="h6"></option>
                    <option value="24" data-i18n="h24"></option>
                </select>
                <span id="boardUpdated" class="seen" style="color: var(--muted);"></span>
            </div>
            <div id="summary" class="summary" aria-live="polite"></div>
            <div id="board"></div>
            <div class="panel">
                <h2 data-i18n="alerts_title"></h2>
                <div class="table-scroll">
                    <table class="jobs-table alerts-table">
                        <thead>
                            <tr>
                                <th data-i18n="col_time"></th>
                                <th data-i18n="col_device"></th>
                                <th data-i18n="col_event"></th>
                                <th data-i18n="col_detail"></th>
                            </tr>
                        </thead>
                        <tbody id="alertsBody"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- Per-host charts (the original dashboard). -->
        <section id="chartView" role="tabpanel" aria-labelledby="tabChart" hidden>
            <div class="controls">
                <label for="hostSelect" data-i18n="host"></label>
                <select id="hostSelect">
                    <option value="" data-i18n="select_host"></option>
                </select>

                <label for="timeRange" data-i18n="time_range"></label>
                <select id="timeRange">
                    <option value="1" data-i18n="h1"></option>
                    <option value="6" data-i18n="h6"></option>
                    <option value="24" selected data-i18n="h24"></option>
                    <option value="72" data-i18n="h72"></option>
                    <option value="168" data-i18n="h168"></option>
                </select>

                <button type="button" onclick="refreshData()" data-i18n="refresh"></button>
            </div>

            <div id="statsContainer" class="stats-grid" style="display: none;" aria-live="polite">
                <div class="stat-card">
                    <div class="stat-value" id="totalPings">-</div>
                    <div class="stat-label" data-i18n="total_pings"></div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="avgResponseTime">-</div>
                    <div class="stat-label" data-i18n="avg_rtt"></div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="minMaxResponseTime">-</div>
                    <div class="stat-label" data-i18n="minmax_rtt"></div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="packetLossRate">-</div>
                    <div class="stat-label" data-i18n="loss_rate"></div>
                </div>
            </div>

            <div class="chart-container">
                <div id="chartContainer" aria-live="polite">
                    <div class="empty" data-i18n="pick_host"></div>
                </div>
            </div>

            <!-- Host management (F4). Hidden unless the server exposes the scheduler
                 API (run-server on a loopback bind); stays hidden in read-only mode. -->
            <div id="monitorSection" class="chart-container" style="display: none;">
                <h2 style="margin-top: 0; font-size: 1.1em;" data-i18n="monitoring"></h2>
                <div class="controls">
                    <input id="newHost" type="text" data-i18n-placeholder="ph_host" aria-label="host">
                    <input id="newName" type="text" data-i18n-placeholder="ph_name" aria-label="name">
                    <input id="newGroup" type="text" data-i18n-placeholder="ph_group" aria-label="group">
                    <input id="newInterval" type="number" min="1" value="60"
                           style="width: 90px;" aria-label="interval (s)">
                    <button type="button" onclick="addHost()" data-i18n="add_host"></button>
                </div>
                <table class="jobs-table">
                    <thead>
                        <tr><th data-i18n="host"></th><th data-i18n="next_run"></th><th></th></tr>
                    </thead>
                    <tbody id="jobsBody" aria-live="polite"></tbody>
                </table>
            </div>
        </section>
    </div>

    <script>
        const LANG = {{ lang|tojson }};
        const I18N = {
            ja: {
                title: 'ネットワーク監視', lead: 'ラインの機器の応答と途絶をひと目で確認',
                tab_board: 'ライン一覧', tab_chart: 'グラフ',
                window: '集計期間:', h1: '直近 1 時間', h6: '直近 6 時間', h24: '直近 24 時間',
                h72: '直近 3 日', h168: '直近 1 週間',
                updated: '更新 {t}',
                ok: '正常', warn: '注意', down: '停止', unknown: '不明',
                ungrouped: '未分類', devices: '{n} 台',
                loss: 'ロス {v}', avg: '平均 {v}', no_reply_yet: '応答なし',
                seen: '最終確認 {t}', last_ok: '最終応答 {t}', never_ok: 'まだ一度も応答がありません',
                stale: '監視データが途絶えています（監視が止まっていないか確認）',
                no_data: '監視データなし',
                why_loss: '期間中に応答なしが {n} 回', why_slow: '直近の応答 {v}（しきい値 {w}）',
                empty_board: '監視中の機器がありません。台帳（CSV）を指定して起動すると、ここに機器が並びます:\nnetwork-checker run-server --devices 台帳.csv',
                alerts_title: '最近のアラート（24時間）', no_alerts: 'アラートはありません。',
                col_time: '時刻', col_device: '機器', col_event: '内容', col_detail: '原因・詳細',
                ev_degraded: '停止・不調', ev_recovered: '復旧', lasted: '（停止 {d}）',
                host: '機器', select_host: '機器を選択…', time_range: '期間:', refresh: '更新',
                total_pings: 'ping 回数', avg_rtt: '平均応答時間', minmax_rtt: '最小 / 最大',
                loss_rate: 'ロス率', pick_host: '機器を選ぶとグラフを表示します',
                loading: '読み込み中…', no_period_data: 'この期間のデータはまだありません',
                monitoring: '監視対象の管理', ph_host: 'IPアドレス / ホスト名', ph_name: '名前（例: PLC-1）',
                ph_group: 'グループ（例: 1ライン）', add_host: '追加', next_run: '次回',
                remove: '削除', no_jobs: '監視中の機器はありません。',
                err_hosts: '機器一覧を取得できませんでした', err_stats: '統計を取得できませんでした',
                err_chart: 'グラフを取得できませんでした', err_add: '追加できませんでした',
                err_remove: '削除できませんでした', err_board: 'ライン一覧を取得できませんでした',
                sec: '{n}秒前', min: '{n}分前', hour: '{n}時間前', day: '{n}日前',
                dur_s: '{n}秒', dur_m: '{n}分', dur_h: '{n}時間',
            },
            en: {
                title: 'Network Checker', lead: 'Replies and outages of every device on the line at a glance',
                tab_board: 'Line board', tab_chart: 'Charts',
                window: 'Window:', h1: 'Last 1 hour', h6: 'Last 6 hours', h24: 'Last 24 hours',
                h72: 'Last 3 days', h168: 'Last week',
                updated: 'updated {t}',
                ok: 'OK', warn: 'Warning', down: 'Down', unknown: 'Unknown',
                ungrouped: 'Ungrouped', devices: '{n} devices',
                loss: 'loss {v}', avg: 'avg {v}', no_reply_yet: 'no reply',
                seen: 'checked {t}', last_ok: 'last reply {t}', never_ok: 'has never replied',
                stale: 'monitoring data stopped (is the monitor still running?)',
                no_data: 'no monitoring data',
                why_loss: '{n} lost in the window', why_slow: 'last reply {v} (limit {w})',
                empty_board: 'No devices are monitored yet. Start with a device list and they appear here:\nnetwork-checker run-server --devices devices.csv',
                alerts_title: 'Recent alerts (24 h)', no_alerts: 'No alerts.',
                col_time: 'Time', col_device: 'Device', col_event: 'Event', col_detail: 'Cause / detail',
                ev_degraded: 'Down / degraded', ev_recovered: 'Recovered', lasted: '(down for {d})',
                host: 'Host', select_host: 'Select a host...', time_range: 'Time Range:', refresh: 'Refresh',
                total_pings: 'Total Pings', avg_rtt: 'Avg Response Time', minmax_rtt: 'Min / Max RTT',
                loss_rate: 'Packet Loss Rate', pick_host: 'Select a host to view ping data',
                loading: 'Loading...', no_period_data: 'No data for this period yet',
                monitoring: 'Monitoring', ph_host: 'host to monitor', ph_name: 'name (e.g. PLC-1)',
                ph_group: 'group (e.g. Line 1)', add_host: 'Add host', next_run: 'Next run',
                remove: 'Remove', no_jobs: 'No hosts monitored yet.',
                err_hosts: 'Failed to load hosts', err_stats: 'Failed to load statistics',
                err_chart: 'Failed to load chart data', err_add: 'Failed to add host',
                err_remove: 'Failed to remove host', err_board: 'Failed to load the line board',
                sec: '{n}s ago', min: '{n} min ago', hour: '{n} h ago', day: '{n} d ago',
                dur_s: '{n} s', dur_m: '{n} min', dur_h: '{n} h',
            },
        };
        const ICONS = { ok: '✓', warn: '!', down: '✕', unknown: '?' };

        function t(key, vars) {
            let s = (I18N[LANG] || I18N.en)[key];
            if (s === undefined) s = I18N.en[key] || key;
            Object.keys(vars || {}).forEach(k => { s = s.split('{' + k + '}').join(vars[k]); });
            return s;
        }

        function applyI18n() {
            document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                el.placeholder = t(el.dataset.i18nPlaceholder);
            });
        }

        function el(tag, cls, text) {
            const e = document.createElement(tag);
            if (cls) e.className = cls;
            if (text !== undefined && text !== null) e.textContent = text;
            return e;
        }

        // The JSON body; on 4xx/5xx a rejection carrying the error body ({error: ...}).
        function getJSON(url, options) {
            return fetch(url, options).then(r => (r.ok
                ? r.json()
                : r.json().catch(() => ({})).then(e => Promise.reject(e))));
        }

        // A single muted row spanning the table, for "nothing here yet".
        function emptyRow(body, cols, text) {
            const td = el('td', null, text);
            td.colSpan = cols;
            td.style.color = 'var(--neutral-fg)';
            body.appendChild(el('tr')).appendChild(td);
        }

        function ago(iso) {
            if (!iso) return '-';
            const s = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
            if (s < 60) return t('sec', { n: s });
            if (s < 3600) return t('min', { n: Math.floor(s / 60) });
            if (s < 86400) return t('hour', { n: Math.floor(s / 3600) });
            return t('day', { n: Math.floor(s / 86400) });
        }

        function duration(sec) {
            if (sec === null || sec === undefined) return '';
            if (sec < 90) return t('dur_s', { n: Math.round(sec) });
            if (sec < 5400) return t('dur_m', { n: Math.round(sec / 60) });
            return t('dur_h', { n: (sec / 3600).toFixed(1) });
        }

        function localTime(iso) {
            const d = new Date(iso);
            return d.toLocaleString(LANG === 'ja' ? 'ja-JP' : 'en-GB',
                { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        function ms(v) {
            if (v === null || v === undefined) return '-';
            return (v < 10 ? v.toFixed(2) : v.toFixed(1)) + 'ms';
        }

        // ---------------------------------------------------------------- tabs
        let activeTab = 'board';

        function showTab(name) {
            activeTab = name;
            document.getElementById('tabBoard').setAttribute('aria-selected', String(name === 'board'));
            document.getElementById('tabChart').setAttribute('aria-selected', String(name === 'chart'));
            document.getElementById('boardView').hidden = name !== 'board';
            document.getElementById('chartView').hidden = name !== 'chart';
            if (name === 'board') {
                loadBoard();
            } else {
                loadHosts();
                loadJobs();
                if (currentHost) loadData(true);
            }
        }

        document.getElementById('tabBoard').addEventListener('click', () => showTab('board'));
        document.getElementById('tabChart').addEventListener('click', () => showTab('chart'));

        // --------------------------------------------------------- line board
        let boardHours = 1;
        document.getElementById('boardRange').addEventListener('change', function () {
            boardHours = parseInt(this.value, 10);
            loadBoard();
        });

        function loadBoard() {
            getJSON('/api/overview?hours=' + encodeURIComponent(boardHours))
                .then(renderBoard)
                .catch(error => {
                    console.error('Error loading board:', error);
                    showError(t('err_board'));
                });
            getJSON('/api/alerts?hours=24&limit=50')
                .then(renderAlerts)
                .catch(error => console.error('Error loading alerts:', error));
        }

        function renderBoard(data) {
            document.getElementById('boardUpdated').textContent =
                t('updated', { t: new Date().toLocaleTimeString(LANG === 'ja' ? 'ja-JP' : 'en-GB') });

            const summary = document.getElementById('summary');
            summary.innerHTML = '';
            ['down', 'warn', 'ok', 'unknown'].forEach(s => {
                const chip = el('div', 'chip');
                chip.appendChild(el('span', 'icon ' + s, ICONS[s]));
                chip.appendChild(el('span', 'num', String(data.counts[s] || 0)));
                chip.appendChild(el('span', 'word', t(s)));
                summary.appendChild(chip);
            });

            const board = document.getElementById('board');
            board.innerHTML = '';
            if (!data.hosts.length) {
                const p = el('div', 'panel empty', t('empty_board'));
                p.style.whiteSpace = 'pre-line';
                board.appendChild(p);
                return;
            }
            // Groups in the order the device list introduced them.
            const groups = [];
            const byName = {};
            data.hosts.forEach(h => {
                const g = h.group || '';
                if (!(g in byName)) {
                    byName[g] = [];
                    groups.push(g);
                }
                byName[g].push(h);
            });
            if (groups.includes('') && groups.length > 1) {
                groups.splice(groups.indexOf(''), 1);
                groups.push('');  // the ungrouped tail goes last
            }
            groups.forEach(g => {
                const section = el('section', 'group');
                const h2 = el('h2', null, g || t('ungrouped'));
                const bad = byName[g].filter(h => h.status === 'down' || h.status === 'warn').length;
                h2.appendChild(el('span', 'sub', t('devices', { n: byName[g].length }) +
                    (bad ? ' · ' + bad + ' ' + t('warn') + '/' + t('down') : '')));
                section.appendChild(h2);
                const tiles = el('div', 'tiles');
                byName[g].forEach(h => tiles.appendChild(renderTile(h)));
                section.appendChild(tiles);
                board.appendChild(section);
            });
        }

        function renderTile(h) {
            const tile = el('button', 'tile ' + h.status);
            tile.type = 'button';
            tile.title = h.note || '';
            tile.onclick = () => openChart(h.host);

            const top = el('div', 'top');
            const state = el('span', 'state');
            state.appendChild(el('span', 'icon ' + h.status, ICONS[h.status]));
            state.appendChild(el('span', null, t(h.status)));
            top.appendChild(state);
            tile.appendChild(top);

            tile.appendChild(el('div', 'name', h.name || h.host));
            if (h.name) tile.appendChild(el('div', 'addr', h.host));

            if (h.total) {
                const loss = h.loss_pct === null ? '-' : h.loss_pct.toFixed(h.loss_pct && h.loss_pct < 1 ? 2 : 1) + '%';
                const avg = h.avg_rtt_ms === null ? t('no_reply_yet') : t('avg', { v: ms(h.avg_rtt_ms) });
                tile.appendChild(el('div', 'metrics', t('loss', { v: loss }) + ' · ' + avg));
            }
            if (h.stale) {
                tile.appendChild(el('div', 'seen', t('stale')));
            } else if (!h.last_ts) {
                tile.appendChild(el('div', 'seen', t('no_data')));
            } else if (h.status === 'down') {
                tile.appendChild(el('div', 'seen', h.last_ok_ts ? t('last_ok', { t: ago(h.last_ok_ts) }) : t('never_ok')));
            } else {
                tile.appendChild(el('div', 'seen', t('seen', { t: ago(h.last_ts) })));
            }
            // Say why a tile is amber: the window's losses or a slow last reply.
            const why = [];
            if (h.status === 'warn' && h.reasons.includes('slow')) {
                why.push(t('why_slow', { v: ms(h.last_rtt_ms), w: ms(h.rtt_warn_ms) }));
            }
            if (h.status === 'warn' && h.reasons.includes('loss')) {
                why.push(t('why_loss', { n: h.lost }));
            }
            // The latest alert explains a red/amber tile (netdiag's root cause when diagnosed).
            if (h.alert && h.alert.event === 'degraded' && (h.status === 'down' || h.status === 'warn')) {
                const cause = h.alert.diagnosis || h.alert.summary;
                if (cause) why.push(localTime(h.alert.timestamp) + ' ' + cause);
            }
            if (why.length) tile.appendChild(el('div', 'why', why.join('\n')));
            return tile;
        }

        function renderAlerts(events) {
            const body = document.getElementById('alertsBody');
            body.innerHTML = '';
            if (!events.length) {
                emptyRow(body, 4, t('no_alerts'));
                return;
            }
            events.forEach(e => {
                const tr = el('tr');
                tr.appendChild(el('td', 'when', localTime(e.timestamp)));
                tr.appendChild(el('td', null, e.name ? e.name + ' (' + e.host + ')' : e.host));
                const ev = el('td');
                const kind = e.event === 'recovered' ? 'ok' : 'down';
                const icon = el('span', 'icon ' + kind, ICONS[kind]);
                icon.style.marginRight = '6px';
                ev.appendChild(icon);
                ev.appendChild(document.createTextNode(t('ev_' + e.event) || e.event));
                if (e.event === 'recovered' && e.duration_s) {
                    ev.appendChild(document.createTextNode(' ' + t('lasted', { d: duration(e.duration_s) })));
                }
                tr.appendChild(ev);
                const detail = el('td', null, e.diagnosis || e.summary || '');
                if (e.runbook && e.runbook.length) {
                    const ul = el('ul');
                    ul.style.margin = '4px 0 0';
                    ul.style.paddingLeft = '18px';
                    e.runbook.slice(0, 3).forEach(step => ul.appendChild(el('li', null, step)));
                    detail.appendChild(ul);
                }
                tr.appendChild(detail);
                body.appendChild(tr);
            });
        }

        function openChart(host) {
            currentHost = host;
            chartReady = false;
            showTab('chart');
        }

        // -------------------------------------------------------------- charts
        let currentHost = '';
        let currentTimeRange = 24;
        // Whether a Plotly figure is currently rendered. Drives newPlot (first
        // render / after a placeholder) vs react (in-place update that preserves
        // the viewer's zoom/pan across the 30s auto-refresh).
        let chartReady = false;

        // Event listeners
        document.getElementById('hostSelect').addEventListener('change', function () {
            currentHost = this.value;
            chartReady = false;  // new host -> fresh plot
            if (currentHost) {
                loadData(true);
            } else {
                document.getElementById('statsContainer').style.display = 'none';
                setChartMessage('empty', t('pick_host'));
            }
        });

        document.getElementById('timeRange').addEventListener('change', function () {
            currentTimeRange = parseInt(this.value, 10);
            chartReady = false;  // different window -> fresh plot
            if (currentHost) {
                loadData(true);
            }
        });

        // Build a query string with every value URL-encoded so hosts containing
        // '&', spaces or other reserved characters don't truncate the parameters.
        function buildQuery(host, hours) {
            return 'host=' + encodeURIComponent(host) + '&hours=' + encodeURIComponent(hours);
        }

        function setChartMessage(cls, msg) {
            chartReady = false;
            document.getElementById('chartContainer').innerHTML =
                '<div class="' + cls + '"></div>';
            document.querySelector('#chartContainer > div').textContent = msg;
        }

        function loadHosts() {
            // Names from the board label the host list when the device list gave them.
            Promise.all([
                getJSON('/api/hosts'),
                getJSON('/api/overview?hours=1').catch(() => ({ hosts: [] })),
            ])
                .then(([hosts, overview]) => {
                    const names = {};
                    overview.hosts.forEach(h => { names[h.host] = h.name; });
                    const all = overview.hosts.map(h => h.host)
                        .concat(hosts.filter(h => !(h in names)));
                    if (currentHost && !all.includes(currentHost)) all.push(currentHost);
                    const select = document.getElementById('hostSelect');
                    select.innerHTML = '';
                    select.appendChild(el('option', null, t('select_host')));
                    select.firstChild.value = '';
                    all.forEach(host => {
                        const option = document.createElement('option');
                        option.value = host;
                        option.textContent = names[host] ? names[host] + ' (' + host + ')' : host;
                        if (host === currentHost) option.selected = true;
                        select.appendChild(option);
                    });
                })
                .catch(error => {
                    console.error('Error loading hosts:', error);
                    showError(t('err_hosts'));
                });
        }

        function loadData(showLoading) {
            if (!currentHost) return;
            if (showLoading || !chartReady) {
                setChartMessage('loading', t('loading'));
            }
            const q = buildQuery(currentHost, currentTimeRange);

            // Statistics: check response.ok so a 4xx/5xx body (which lacks the
            // stat keys) can't slip into updateStats and throw on .toFixed().
            getJSON('/api/stats?' + q)
                .then(updateStats)
                .catch(error => {
                    console.error('Error loading stats:', error);
                    clearStats();
                    showError(error && error.error ? error.error : t('err_stats'));
                });

            // Chart: 404 means "no data for this period" -- a normal empty state,
            // shown neutrally. Only real failures (5xx / network) get the red box.
            fetch('/api/ping_chart?' + q + '&lang=' + encodeURIComponent(LANG))
                .then(response => {
                    if (response.status === 404) {
                        return response.json().catch(() => ({})).then(d => {
                            setChartMessage('empty', d.error || t('no_period_data'));
                            return null;
                        });
                    }
                    if (!response.ok) {
                        return response.json().catch(() => ({})).then(e => Promise.reject(e));
                    }
                    return response.json();
                })
                .then(fig => {
                    if (fig) renderChart(fig);
                })
                .catch(error => {
                    console.error('Error loading chart:', error);
                    setChartMessage('error', error && error.error ? error.error : t('err_chart'));
                });
        }

        function renderChart(fig) {
            const container = document.getElementById('chartContainer');
            if (!chartReady) {
                container.innerHTML = '';  // drop the loading/empty placeholder
                Plotly.newPlot(container, fig.data, fig.layout, { responsive: true });
                chartReady = true;
            } else {
                // react() diffs the figure and keeps the current zoom/pan.
                Plotly.react(container, fig.data, fig.layout, { responsive: true });
            }
        }

        function updateStats(data) {
            if (!data || typeof data.total_pings !== 'number') {
                clearStats();
                return;
            }
            document.getElementById('totalPings').textContent = data.total_pings;
            document.getElementById('avgResponseTime').textContent =
                (data.avg_response_time || 0).toFixed(1) + 'ms';
            const mn = (data.min_response_time || 0).toFixed(1);
            const mx = (data.max_response_time || 0).toFixed(1);
            document.getElementById('minMaxResponseTime').textContent = mn + ' / ' + mx + 'ms';
            document.getElementById('packetLossRate').textContent =
                (data.packet_loss_rate || 0).toFixed(1) + '%';
            document.getElementById('statsContainer').style.display = 'grid';
        }

        function clearStats() {
            ['totalPings', 'avgResponseTime', 'minMaxResponseTime', 'packetLossRate']
                .forEach(id => { document.getElementById(id).textContent = '—'; });
            document.getElementById('statsContainer').style.display = 'grid';
        }

        function refreshData() {
            if (currentHost) {
                loadData(true);
            }
            loadHosts();
            loadJobs();
        }

        // --- Host management (F4) --------------------------------------------
        // Reveal the Monitoring panel only when the scheduler API answers; a 503
        // (read-only deployment / public bind) leaves it hidden.
        function loadJobs() {
            fetch('/api/jobs')
                .then(response => (response.ok ? response.json() : null))
                .then(jobs => {
                    if (jobs === null) return;  // scheduler not running -> stay hidden
                    document.getElementById('monitorSection').style.display = 'block';
                    renderJobs(jobs);
                })
                .catch(error => console.error('Error loading jobs:', error));
        }

        function renderJobs(jobs) {
            const body = document.getElementById('jobsBody');
            body.innerHTML = '';
            if (!jobs.length) {
                emptyRow(body, 3, t('no_jobs'));
                return;
            }
            jobs.forEach(job => {
                const tr = document.createElement('tr');
                const hostCell = document.createElement('td');
                hostCell.textContent = job.host;
                const nextCell = document.createElement('td');
                nextCell.textContent = job.next_run_time ? localTime(job.next_run_time) : '-';
                const actionCell = document.createElement('td');
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = t('remove');
                btn.onclick = () => removeHost(job.host);
                actionCell.appendChild(btn);
                tr.appendChild(hostCell);
                tr.appendChild(nextCell);
                tr.appendChild(actionCell);
                body.appendChild(tr);
            });
        }

        function addHost() {
            const host = document.getElementById('newHost').value.trim();
            const interval = parseInt(document.getElementById('newInterval').value, 10) || 60;
            if (!host) return;
            getJSON('/api/hosts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    host: host,
                    interval: interval,
                    name: document.getElementById('newName').value.trim(),
                    group: document.getElementById('newGroup').value.trim(),
                }),
            })
                .then(() => {
                    ['newHost', 'newName', 'newGroup'].forEach(id => { document.getElementById(id).value = ''; });
                    loadJobs();
                    loadHosts();
                })
                .catch(error => showError(error && error.error ? error.error : t('err_add')));
        }

        function removeHost(host) {
            fetch('/api/hosts/' + encodeURIComponent(host), { method: 'DELETE' })
                .then(response => {
                    if (!response.ok) return Promise.reject();
                    loadJobs();
                })
                .catch(() => showError(t('err_remove')));
        }

        function showError(message) {
            const container = document.querySelector('.container');
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error';
            errorDiv.setAttribute('role', 'alert');
            errorDiv.textContent = message;
            container.insertBefore(errorDiv, container.firstChild.nextSibling);
            setTimeout(() => { errorDiv.remove(); }, 5000);
        }

        applyI18n();
        showTab('board');

        // Auto-refresh: the board every 15s, the chart every 30s. No loading
        // flash and react() keeps the zoom, so an interactive chart isn't yanked
        // back to its default view.
        setInterval(() => {
            if (activeTab === 'board') loadBoard();
        }, 15000);
        setInterval(() => {
            if (activeTab === 'chart' && currentHost) {
                loadData(false);
            }
        }, 30000);
    </script>
</body>
</html>
