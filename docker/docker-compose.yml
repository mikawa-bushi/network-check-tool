# docker compose -f docker/docker-compose.yml up -d --build
#
# Two services sharing one database:
#   dashboard  — web UI on http://127.0.0.1:9991 (host loopback only)
#   monitor    — pings every device in docker/devices.csv (create it first,
#                e.g. from `netdiag scan --save docker/devices.csv`)
services:
  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    network_mode: host
    volumes:
      - nct-data:/data
    restart: unless-stopped

  monitor:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    network_mode: host
    volumes:
      - nct-data:/data
      - ./devices.csv:/config/devices.csv:ro
    command: ["network-checker", "start-monitoring", "--config", "/config/devices.csv", "--diagnose"]
    restart: unless-stopped

volumes:
  nct-data:
